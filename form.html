<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <fieldset>

        <form action="#">
            <label for="name">Username: </label>
            <input type="text" name="name" placeholder="Enter your name" id="name" required>

            <br>
            <br>

            <label for="Password">Password:</label>
            <input type="password" name="Password" placeholder="Enter your password" id="Password">

            <br><br>

            <label for="email">Email: &emsp; </label>
            <input type="text" name="email" id="email" placeholder="Enter your email">

            <br><br>

            <label for="date">Date: &emsp;</label>
            <input type="date" name="date" id="date">

            <br><br>

            <label for="gender">Gender: </label>
            <input type="radio" name="gender " id="gender"><label for="gender">Male</label>
            <input type="radio" name="gender " id="gender"><label for="gender">Female</label>


            <br><br>

            <label for="hobb">Hobbies: </label>
            <input type="checkbox" id="hobb1" name="hobb1"><label for="football">Football </label>
            <input type="checkbox" id="hobb2" name="hobb2"><label for="cricket">Cricket </label>

            <br><br>

            <label for="lan">Language: </label>
            <select name="lan" id="lan">
                <option value="">Select lang</option>
                <option value="c">Cpp</option>
                <option value="j">Java</option>
                <option value="p">Python </option>
            </select>
        </form>







    </fieldset>
</body>

</html>
